name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements*.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run linting (ruff)
        run: |
          ruff check .

      - name: Run pytest and capture output
        run: |
          python -m pytest -v --cov=app --cov-report=term --cov-report=xml:coverage.xml 2>&1 | tee pytest-output.txt

      - name: Save pytest output for sprint submission
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-output
          path: backend/pytest-output.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Save coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 30
          if-no-files-found: ignore
