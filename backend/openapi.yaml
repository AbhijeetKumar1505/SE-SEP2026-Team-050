  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: The access token returned by the login endpoint. It carries the
        user's role.
      scheme: bearer
      type: http
info:
  contact:
    name: Team 050, IITM BS Software Engineering
  description: 'REST API of the Student Mentoring and Career Support Platform (IITM
    BS Software Engineering project, September 2026, Team 050).


    Every endpoint lists the user stories it implements in `x-user-stories`, and every
    error uses the shared `Error` schema. Endpoints that need a login take a bearer
    token in the `Authorization` header.


    **External and GenAI APIs.** The API calls no external or GenAI service yet. Emails
    (verification and activation links, notices) are sent over SMTP with Flask-Mail
    to the provider chosen with hosting; in development they go to Mailpit or the
    log. The AI features (problem coach, mentor-fit notes, mentorship summary) come
    in Sprint 2.'
  title: IITM BS Mentoring API
  version: 0.1.0
openapi: 3.0.3
paths:
  /api/audit:
    get:
      description: 'Who did what, to which record, when and why, newest first. With
        `entity_type` and `entity_id`

        it is the history of one record, such as a case or a mentor. Only IIC coordinators
        can read the

        audit log, and nobody can change it.


        Paginated: `page` and `page_size` choose the page, and the `X-Pagination`
        header gives the

        total.'
      parameters:
      - description: Only entries about this kind of record, such as `mentor`
        in: query
        name: entity_type
        required: false
        schema:
          example: mentor
          pattern: ^[a-z][a-z0-9_]{0,63}$
          type: string
      - description: Only entries about this record. Needs `entity_type`
        in: query
        name: entity_id
        required: false
        schema:
          example: 3
          minimum: 1
          type: integer
      - description: Only entries for this action
        in: query
        name: action
        required: false
        schema:
          example: verify_mentor
          pattern: ^[a-z][a-z0-9_]{0,63}$
          type: string
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AuditEntry'
                type: array
          description: OK
          headers:
            X-Pagination:
              $ref: '#/components/headers/PAGINATION'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: List audit entries
      tags:
      - audit
      x-roles:
      - iic
      x-user-stories:
      - US-14
      - US-18
  /api/auth/login:
    post:
      description: 'Exchanges an email and password for an access token. Send the
        token on later requests in the

        `Authorization` header as `Bearer <token>`. The token carries the user''s
        roles.


        Students can log in once they have verified their email (US-01), and mentors
        once they have

        activated their account (US-14). A wrong email and a wrong password give the
        same 401.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: Log in
      tags:
      - auth
      x-user-stories:
      - US-01
      - US-14
  /api/auth/logout:
    post:
      description: Revokes the token sent with this request. Any later request with
        it gets 401.
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Log out
      tags:
      - auth
      x-user-stories:
      - US-01
      - US-14
  /api/auth/me:
    get:
      description: 'Returns the account behind the token, with its roles and the name
        and roll number from the

        student or mentor profile. The frontend uses it to choose which pages to show
        and to greet

        the user.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Get the logged-in user
      tags:
      - auth
      x-user-stories:
      - US-01
      - US-14
  /api/auth/resend-verification:
    post:
      description: 'Emails a new link if a student signed up with this email and has
        not verified it yet; older

        links stop working. The response is the same whether or not an account exists,
        so it does not

        reveal who has signed up.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Email'
        required: true
      responses:
        '204':
          description: No Content
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: Send a new verification link
      tags:
      - auth
      x-user-stories:
      - US-01
  /api/auth/signup:
    post:
      description: "Creates a student account and emails a verification link that\
        \ works for 24 hours. Nobody can\nlog in until the link is used. The student's\
        \ name comes from IIC's roster.\n\n- **422** \"Use your IITM BS institute\
        \ email.\" when the email is not on an approved domain, and\n  a similar message\
        \ when it is not the email IIC registered for the roll number. Nothing is\n\
        \  stored.\n- **403** \"You are not registered with IIC. Please contact IIC\
        \ to register.\" when the roll\n  number is not on the roster, or IIC has\
        \ removed it.\n- **409** when a verified account already exists for the roll\
        \ number or the email.\n\nSigning up again before verifying sets the new password\
        \ and sends a new link; older links stop\nworking."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUp'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUpResult'
          description: Created
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '409':
          $ref: '#/components/responses/CONFLICT'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: Sign up as a student
      tags:
      - auth
      x-user-stories:
      - US-01
  /api/auth/verify-email:
    post:
      description: 'Uses the token from the link in the sign-up email. The account
        becomes active and the student

        is logged in, so the web app can take them straight to their profile (US-02).


        - **404** when the token is unknown, or a newer link has replaced it.

        - **409** when the link has already been used. Log in instead.

        - **410** when the link is more than 24 hours old. Ask for a new one.'
      requestBody:
        content:
          application/json:
            schema:
