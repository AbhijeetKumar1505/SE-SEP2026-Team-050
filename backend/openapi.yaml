          description: Who did it. Empty for automatic actions, such as the daily
            checks
        created_at:
          description: When it happened (UTC)
          format: date-time
          type: string
        details:
          example: Verified after checking LinkedIn and employer.
          nullable: true
          type: string
        entity_id:
          example: 3
          nullable: true
          type: integer
        entity_type:
          example: mentor
          type: string
        id:
          example: 41
          type: integer
      required:
      - action
      - actor
      - created_at
      - details
      - entity_id
      - entity_type
      - id
      type: object
    CapacityRequestAnswer:
      additionalProperties: false
      properties:
        accept:
          example: true
          type: boolean
      required:
      - accept
      type: object
    CapacityRequestResponse:
      additionalProperties: false
