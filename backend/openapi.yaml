          - Outside my expertise
          - No time right now
          - Not a good fit
          - Other
          example: No time right now
          type: string
      required:
      - reason
      type: object
    DeclineResponse:
      additionalProperties: false
      properties:
        id:
          description: The problem that goes back to IIC's queue
          type: integer
        status:
          example: reassignment_needed
          type: string
      required:
      - id
      - status
      type: object
    Email:
      additionalProperties: false
      properties:
        email:
          example: 23f1002345@ds.study.iitm.ac.in
