components:
  headers:
    PAGINATION:
      description: Pagination metadata
      schema:
        $ref: '#/components/schemas/PaginationMetadata'
  responses:
    BAD_REQUEST:
      content:
        application/json:
          example:
            code: 400
            message: The request could not be read.
            status: Bad Request
          schema:
            $ref: '#/components/schemas/Error'
      description: The request body is not valid JSON.
    CONFLICT:
      content:
        application/json:
          example:
            code: 409
            message: This conflicts with the current state of the resource.
            status: Conflict
          schema:
            $ref: '#/components/schemas/Error'
      description: The request conflicts with the current state, for example a duplicate
        or a status that does not allow it.
    DEFAULT_ERROR:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Any other error, in the shared error format.
    FORBIDDEN:
      content:
        application/json:
          example:
            code: 403
            message: You do not have permission to do this.
            status: Forbidden
          schema:
            $ref: '#/components/schemas/Error'
      description: Logged in, but this role or this user may not do this.
    INTERNAL_SERVER_ERROR:
      content:
        application/json:
          example:
            code: 500
            message: Something went wrong on the server. Please try again.
            status: Internal Server Error
          schema:
            $ref: '#/components/schemas/Error'
      description: Unexpected server error. It is logged; the response never includes
        its details.
    NOT_FOUND:
      content:
        application/json:
          example:
            code: 404
            message: The requested resource was not found.
            status: Not Found
          schema:
            $ref: '#/components/schemas/Error'
      description: No such resource, or it is not visible to this user.
    UNAUTHORIZED:
      content:
        application/json:
          example:
            code: 401
            message: Log in to continue.
            status: Unauthorized
          schema:
            $ref: '#/components/schemas/Error'
      description: Not logged in, or the login token has expired.
    UNPROCESSABLE_ENTITY:
      content:
        application/json:
          example:
            code: 422
            errors:
              json:
                description:
                - Shorter than minimum length 30.
            message: Some fields are invalid.
            status: Unprocessable Entity
          schema:
            $ref: '#/components/schemas/Error'
      description: One or more fields are invalid. `errors` names each field and what
        is wrong with it.
  schemas:
    Actor:
      additionalProperties: false
      properties:
        email:
          example: deepa.krishnan@iitm.ac.in
          format: email
          type: string
        id:
          example: 2
          type: integer
      required:
      - email
      - id
      type: object
    Assignment:
      additionalProperties: false
      properties:
        assigned_at:
          format: date-time
          type: string
        assigned_by:
          example: deepa
          type: string
        deadline:
          description: When the mentor must respond (UTC)
          format: date-time
          type: string
        goal:
          example: Clarity on electives
          type: string
        id:
          example: 3
          type: integer
        problem:
          example: Choosing electives...
          type: string
        student:
          additionalProperties: {}
          example:
            careerInterest: Job
            courses: Python, DBMS
            level: BS
            name: Rahul
          type: object
        tags:
          example:
          - Computer vision
          items:
            type: string
          type: array
      required:
      - assigned_at
      - assigned_by
      - deadline
      - goal
      - id
      - problem
      - student
      - tags
      type: object
    AuditEntry:
      additionalProperties: false
      properties:
        action:
          example: verify_mentor
          type: string
        actor:
          anyOf:
          - $ref: '#/components/schemas/Actor'
