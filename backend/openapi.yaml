          example: 12
          type: integer
      required:
      - active
      - group
      - id
      - name
      - problems
      type: object
    TagCreate:
      additionalProperties: false
      properties:
        group:
          example: Technical skills
          maxLength: 64
          minLength: 2
          type: string
        name:
          example: Data engineering
          maxLength: 100
          minLength: 2
          type: string
      required:
      - group
      - name
      type: object
    TagUpdate:
      additionalProperties: false
      properties:
        active:
          description: False retires the tag; true restores it
          type: boolean
      required:
      - active
      type: object
    Token:
      additionalProperties: false
      properties:
        access_token:
          description: 'Send as: Authorization: Bearer <token>'
          type: string
        expires_in:
          description: Seconds until the token expires
          type: integer
        token_type:
          example: Bearer
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - access_token
      - expires_in
      - token_type
      - user
      type: object
    User:
      additionalProperties: false
      properties:
        email:
          example: 23f1002345@ds.study.iitm.ac.in
          format: email
          type: string
        id:
          example: 7
          type: integer
        name:
          description: Display name from the student or mentor profile
          example: Ananya Rao
          readOnly: true
        roles:
          example:
          - student
          items:
            enum:
            - student
            - mentor
            - iic
            - leadership
            type: string
          type: array
        roll:
          description: Student roll number; null for staff and mentors
          example: 23f1002345
          nullable: true
          readOnly: true
      required:
      - email
      - id
      - name
      - roles
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: The access token returned by the login endpoint. It carries the
        user's role.
      scheme: bearer
      type: http
info:
  contact:
    name: Team 050, IITM BS Software Engineering
  description: 'REST API of the Student Mentoring and Career Support Platform (IITM
    BS Software Engineering project, September 2026, Team 050).


    Every endpoint lists the user stories it implements in `x-user-stories`, and every
    error uses the shared `Error` schema. Endpoints that need a login take a bearer
    token in the `Authorization` header.'
  title: IITM BS Mentoring API
  version: 0.1.0
openapi: 3.0.3
paths:
  /api/audit:
    get:
      description: 'Who did what, to which record, when and why, newest first. With
        `entity_type` and `entity_id`

        it is the history of one record, such as a case or a mentor. Only IIC coordinators
        can read the

        audit log, and nobody can change it.


        Paginated: `page` and `page_size` choose the page, and the `X-Pagination`
        header gives the

        total.'
      parameters:
      - description: Only entries about this kind of record, such as `mentor`
        in: query
        name: entity_type
        required: false
        schema:
          example: mentor
          pattern: ^[a-z][a-z0-9_]{0,63}$
          type: string
      - description: Only entries about this record. Needs `entity_type`
        in: query
        name: entity_id
        required: false
        schema:
          example: 3
          minimum: 1
          type: integer
      - description: Only entries for this action
        in: query
        name: action
        required: false
        schema:
          example: verify_mentor
          pattern: ^[a-z][a-z0-9_]{0,63}$
          type: string
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AuditEntry'
                type: array
          description: OK
          headers:
            X-Pagination:
              $ref: '#/components/headers/PAGINATION'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: List audit entries
      tags:
      - audit
      x-roles:
      - iic
      x-user-stories:
      - US-14
      - US-18
  /api/auth/login:
    post:
      description: 'Exchanges an email and password for an access token. Send the
        token on later requests in the

        `Authorization` header as `Bearer <token>`. The token carries the user''s
        roles.


        Students can log in once they have verified their email (US-01), and mentors
        once they have

        activated their account (US-14). A wrong email and a wrong password give the
        same 401.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: Log in
      tags:
      - auth
      x-user-stories:
      - US-01
      - US-14
  /api/auth/logout:
    post:
      description: Revokes the token sent with this request. Any later request with
        it gets 401.
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Log out
      tags:
      - auth
      x-user-stories:
      - US-01
      - US-14
  /api/auth/me:
    get:
      description: 'Returns the account behind the token, with its roles and the name
        and roll number from the

        student or mentor profile. The frontend uses it to choose which pages to show
        and to greet

        the user.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Get the logged-in user
      tags:
      - auth
      x-user-stories:
      - US-01
      - US-14
  /api/cases:
    post:
      description: 'The student (or the mentor) explains what happened. IIC reviews
        it and decides; the other

        participant is not told until then. Only one case per mentorship can be open
        at a time, so a

        second one gets 409.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
          description: Created
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '409':
          $ref: '#/components/responses/CONFLICT'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Ask IIC to change or end a mentorship
      tags:
      - cases
      x-roles:
      - student
      - mentor
      x-user-stories:
      - US-07
  /api/feedback:
    post:
      description: 'The student and the mentor each report progress separately: no
        progress, some progress or goal

        met. The comment is optional. Only IIC reads it; it is never shown to the
        other participant.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackWrite'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
          description: Created
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Submit progress feedback
      tags:
      - feedback
      x-roles:
      - student
      - mentor
      x-user-stories:
      - US-08
  /api/health:
    get:
      description: Used by the host's health check and by CI. Needs no login.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: OK
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      summary: Report that the API is running
      tags:
      - system
  /api/mentors/capacity-requests/{request_id}/answer:
    parameters:
    - in: path
      name: request_id
      required: true
      schema:
        minimum: 0
        type: integer
    post:
      description: 'IIC asks whether the mentor can take on one more student. Accepting
        raises the

        mentor''s capacity by one; declining leaves it unchanged.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapacityRequestAnswer'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityRequestResponse'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '409':
          $ref: '#/components/responses/CONFLICT'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Accept or decline a capacity increase request
      tags:
      - mentors
      x-roles:
      - mentor
      x-user-stories:
      - US-18
  /api/mentors/me:
    get:
      description: 'Availability, contact details, capacity and expertise. Capacity
        and expertise are

        read-only here; they are set by IIC.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorProfile'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Get my profile
      tags:
      - mentors
      x-roles:
      - mentor
      x-user-stories:
      - US-10
    put:
      description: 'Saves whether the mentor is available for new students, their
        preferred channel,

        contact details, when they are free and their time zone.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MentorProfileUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorProfile'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Update my availability and contact details
      tags:
      - mentors
      x-roles:
      - mentor
      x-user-stories:
      - US-10
  /api/mentors/me/dashboard:
    get:
      description: 'Capacity and load, pending assignments waiting for a response,
        active mentorships,

        session stats this month and the next progress-feedback checkpoint.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: My mentor dashboard
      tags:
      - mentors
      x-roles:
      - mentor
      x-user-stories:
      - US-10
  /api/mentors/mentorships/{mentorship_id}:
    get:
      description: 'The mentor''s view of an active mentorship: student, start date,
        sessions held

        and the next planned session.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorshipDetail'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Get a mentorship's detail
      tags:
      - mentors
      x-roles:
      - mentor
      x-user-stories:
      - US-10
    parameters:
    - in: path
      name: mentorship_id
      required: true
      schema:
        minimum: 0
        type: integer
  /api/mentors/mentorships/{mentorship_id}/accept:
    parameters:
    - in: path
      name: mentorship_id
      required: true
      schema:
        minimum: 0
        type: integer
    post:
      description: 'Activates the mentorship, notifies the student and moves the problem
        to

        "mentor assigned". Only the assigned mentor may accept.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorshipSummary'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '409':
          $ref: '#/components/responses/CONFLICT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Accept a pending assignment
      tags:
      - mentors
      x-roles:
      - mentor
      x-user-stories:
      - US-05
  /api/mentors/mentorships/{mentorship_id}/decline:
    parameters:
    - in: path
      name: mentorship_id
      required: true
      schema:
        minimum: 0
        type: integer
    post:
      description: 'The problem goes back to IIC''s queue so another mentor can be
        assigned.

        Only the assigned mentor may decline.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineAssignment'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclineResponse'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '409':
          $ref: '#/components/responses/CONFLICT'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Decline a pending assignment
      tags:
      - mentors
      x-roles:
      - mentor
      x-user-stories:
      - US-05
  /api/mentorships/me:
    get:
      description: 'The student''s active mentorship, with the mentor''s contact details,
        the goal, next steps, sessions

        and the next feedback checkpoint. `mentorship` is null until a mentor accepts.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyMentorship'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Get my mentorship
      tags:
      - mentorships
      x-roles:
      - student
      x-user-stories:
      - US-05
      - US-06
  /api/mentorships/{mentorship_id}:
    parameters:
    - in: path
      name: mentorship_id
      required: true
      schema:
        minimum: 0
        type: integer
    put:
      description: 'Either participant may reword the goal they are working towards.
        It is shared with the other

        participant and with IIC.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MentorshipUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mentorship'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Update the mentorship goal
      tags:
      - mentorships
      x-roles:
      - student
      - mentor
      x-user-stories:
      - US-06
  /api/mentorships/{mentorship_id}/reached-out:
    parameters:
    - in: path
      name: mentorship_id
      required: true
      schema:
        minimum: 0
        type: integer
    post:
      description: 'The student makes the first contact themselves; this records the
        date so the mentor and IIC can

        see it. Sending it again changes nothing.'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Record that I reached out
      tags:
      - mentorships
      x-roles:
      - student
      x-user-stories:
      - US-05
  /api/mentorships/{mentorship_id}/steps:
    parameters:
    - in: path
      name: mentorship_id
      required: true
      schema:
        minimum: 0
        type: integer
    post:
      description: Both participants share one checklist. The response is the updated
        list.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepWrite'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Step'
                type: array
          description: Created
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Add a next step
      tags:
      - mentorships
      x-roles:
      - student
      - mentor
      x-user-stories:
      - US-06
  /api/mentorships/{mentorship_id}/steps/{step_id}:
    delete:
      description: The response is the updated list.
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Step'
                type: array
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Remove a next step
      tags:
      - mentorships
      x-roles:
      - student
      - mentor
      x-user-stories:
      - US-06
    parameters:
    - in: path
      name: mentorship_id
      required: true
      schema:
        minimum: 0
        type: integer
    - in: path
      name: step_id
      required: true
      schema:
        minLength: 1
        type: string
  /api/mentorships/{mentorship_id}/steps/{step_id}/toggle:
    parameters:
    - in: path
      name: mentorship_id
      required: true
      schema:
        minimum: 0
        type: integer
    - in: path
      name: step_id
      required: true
      schema:
        minLength: 1
        type: string
    post:
      description: The response is the updated list.
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Step'
                type: array
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Mark a next step done or not done
      tags:
      - mentorships
      x-roles:
      - student
      - mentor
      x-user-stories:
      - US-06
  /api/notifications:
    get:
      description: 'The logged-in user''s dashboard notices, newest first: assignments,
        status changes, acceptances,

        reminders and decisions. Each was also sent by email. With `unread=true` only
        unread notices

        are listed, and the `X-Pagination` header''s `total` is the count for the
        bell.'
      parameters:
      - description: Only notices not yet marked as read (for the bell's count)
        in: query
        name: unread
        required: false
        schema:
          default: false
          type: boolean
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Notification'
                type: array
          description: OK
          headers:
            X-Pagination:
              $ref: '#/components/headers/PAGINATION'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: List my notices
      tags:
      - notifications
      x-user-stories:
      - US-05
      - US-09
  /api/notifications/read-all:
    post:
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Mark all my notices as read
      tags:
      - notifications
      x-user-stories:
      - US-05
      - US-09
  /api/notifications/{notification_id}/read:
    parameters:
    - in: path
      name: notification_id
      required: true
      schema:
        minimum: 0
        type: integer
    post:
      description: 'Marking it again changes nothing. A notice is shown only to its
        recipient, so anyone else''s

        gets 404.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Mark a notice as read
      tags:
      - notifications
      x-user-stories:
      - US-05
      - US-09
  /api/problems:
    post:
      description: 'The student describes their problem, picks one to five active
        topic tags and says what they want

        to achieve. IIC reviews it next. A student has one open problem at a time,
        and must finish their

        profile first, so a duplicate or an incomplete profile gets 409.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemWrite'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Created
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '409':
          $ref: '#/components/responses/CONFLICT'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Submit a problem
      tags:
      - problems
      x-roles:
      - student
      x-user-stories:
      - US-03
  /api/problems/me/status:
    get:
      description: 'Students have one open problem at a time. `has_open_problem` is
        true while a submitted problem is

        still with IIC or a mentor, so the form is closed until it is withdrawn or
        closed.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitStatus'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Can I submit a problem?
      tags:
      - problems
      x-roles:
      - student
      x-user-stories:
      - US-03
  /api/problems/{problem_id}:
    parameters:
    - in: path
      name: problem_id
      required: true
      schema:
        minimum: 0
        type: integer
    put:
      description: 'Only the student who submitted it may edit it, and only until
        a mentor accepts. After that the

        request is read-only and gets 409.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemWrite'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '409':
          $ref: '#/components/responses/CONFLICT'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Edit my problem
      tags:
      - problems
      x-roles:
      - student
      x-user-stories:
      - US-03
  /api/problems/{problem_id}/withdraw:
    parameters:
    - in: path
      name: problem_id
      required: true
      schema:
        minimum: 0
        type: integer
    post:
      description: 'IIC stops working on it. Like editing, this is only possible until
        a mentor accepts; after that

        the student asks IIC to change or end the mentorship instead.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '409':
          $ref: '#/components/responses/CONFLICT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Withdraw my problem
      tags:
      - problems
      x-roles:
      - student
      x-user-stories:
      - US-03
  /api/sessions:
    post:
      description: 'A planned session stores its date and start time; a held session
        stores its date and duration.

        Only the mentorship''s student or mentor may add one, and the API records
        which side did.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionWrite'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: Created
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Schedule or log a session
      tags:
      - sessions
      x-roles:
      - student
      - mentor
      x-user-stories:
      - US-11
  /api/sessions/{session_id}:
    parameters:
    - in: path
      name: session_id
      required: true
      schema:
        minimum: 0
        type: integer
    put:
      description: 'Editing the details clears the other participant''s confirmation,
        because a changed session needs

        confirming again.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionWrite'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Edit a session
      tags:
      - sessions
      x-roles:
      - student
      - mentor
      x-user-stories:
      - US-11
  /api/sessions/{session_id}/cancel:
    parameters:
    - in: path
      name: session_id
      required: true
      schema:
        minimum: 0
        type: integer
    post:
      description: 'The session stays in the list as cancelled and does not count
        as held. Only a planned session

        can be cancelled; anything else gets 409.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '409':
          $ref: '#/components/responses/CONFLICT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Cancel a planned session
      tags:
      - sessions
      x-roles:
      - student
      - mentor
      x-user-stories:
      - US-11
  /api/sessions/{session_id}/confirm:
    parameters:
    - in: path
      name: session_id
      required: true
      schema:
        minimum: 0
        type: integer
    post:
      description: 'The participant who did not log the session confirms it. Confirming
        twice, or confirming your

        own log, gets 409.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '409':
          $ref: '#/components/responses/CONFLICT'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Confirm a held session
      tags:
      - sessions
      x-roles:
      - student
      - mentor
      x-user-stories:
      - US-11
  /api/settings/tags:
    get:
      description: 'Every tag IIC has, with the number of problems using it. `active`
        is false once a tag is retired:

        retired tags stay here so past problems and insights keep their topics, but
        students cannot choose

        them for a new problem.'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Tag'
                type: array
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: List topic tags
      tags:
      - settings
      x-user-stories:
      - US-03
      - US-21
    post:
      description: Adds a tag to IIC's shared list. The name is unique, ignoring case,
        so a duplicate gets 409.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
          description: Created
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '409':
          $ref: '#/components/responses/CONFLICT'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Add a topic tag
      tags:
      - settings
      x-roles:
      - iic
      x-user-stories:
      - US-21
  /api/settings/tags/{tag_id}:
    parameters:
    - in: path
      name: tag_id
      required: true
      schema:
        minimum: 0
        type: integer
    put:
      description: 'IIC retires a tag instead of deleting it, so old problems keep
        their topics. Sending the same

        value again changes nothing.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Retire or restore a topic tag
      tags:
      - settings
      x-roles:
      - iic
      x-user-stories:
      - US-21
  /api/students/me:
    get:
      description: 'The student''s name and roll number come from IIC''s roster and
        cannot be edited here. `complete`

        is false until the student has filled in the programme, CGPA, courses and
        career interest.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Get my profile
      tags:
      - students
      x-roles:
      - student
      x-user-stories:
      - US-02
    put:
      description: 'Saves the programme level, CGPA, completed courses and career
        interest. The CGPA is visible only

        to IIC.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentProfileUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Update my profile
      tags:
      - students
      x-roles:
      - student
      x-user-stories:
      - US-02
  /api/students/me/home:
    get:
      description: 'One request for the student''s home page: their latest problem,
        their active mentorship if a

        mentor has accepted, and a summary of their profile. `accept_hours` is the
        time a mentor has to

        respond, from IIC''s timing settings.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Home'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: My student home
      tags:
      - students
      x-roles:
      - student
      x-user-stories:
      - US-02
      - US-03
      - US-05
servers:
- description: Local development server (flask run)
  url: http://127.0.0.1:5000
tags:
- description: Health check for the host and CI.
  name: system
- description: 'C1 Identity and access: Sign-up, email verification, mentor activation,
    login and roles (US-01, US-14).'
  name: auth
- description: 'C2 Students and roster: IIC''s roster of registered students and each
    student''s profile (US-02, US-15).'
  name: students
- description: 'C3 Mentor pool: Verified mentors, their expertise, availability and
    capacity (US-10, US-14, US-18).'
  name: mentors
- description: 'C4 Settings and tags: Topic tags, approved email domains and timing
    windows (US-01, US-03, US-21).'
  name: settings
- description: 'C5 Problem intake: Students'' problems, their status and IIC''s queue
    (US-03, US-05, US-16, US-20).'
  name: problems
- description: 'C6 Recommendations: Up to 4 ranked mentors for a problem, with reasons
    (US-04).'
  name: matching
- description: 'C7 Mentorships: Assignment, accept or decline, goal, next steps and
    ending (US-05, US-06, US-09, US-13, US-16).'
  name: mentorships
- description: 'C8 Cases: Change, end and misconduct cases, decided by IIC (US-07,
    US-18).'
  name: cases
- description: 'C9 Sessions: Scheduled and logged sessions, with no conversation content
    (US-11).'
  name: sessions
- description: 'C10 Progress feedback: Progress status from student and mentor, seen
    only by IIC (US-08, US-12).'
  name: feedback
- description: 'C11 Monitoring and alerts: IIC''s monitoring view and the daily escalation
    checks (US-17, US-21).'
  name: monitoring
- description: 'C12 Programme insights: Aggregate demand, supply and outcome figures
    for leadership (US-19).'
  name: insights
- description: 'C13 Notifications: Email and dashboard notices for every event (Most
    stories).'
  name: notifications
- description: 'C14 Audit log: Permanent record of decisions and status changes (US-14,
    US-18).'
  name: audit
x-tagGroups:
- name: Platform foundation
  tags:
  - system
  - settings
  - notifications
  - audit
- name: Onboarding and profiles
  tags:
  - auth
  - students
  - mentors
- name: Mentor matching
  tags:
  - problems
  - matching
  - mentorships
- name: Mentorship tracking and feedback
  tags:
  - sessions
  - feedback
  - monitoring
- name: Changes, termination and safety
  tags:
  - cases
- name: Programme insights
  tags:
  - insights
