      required:
      - body
      - created_at
      - id
      - link
      - read
      - subject
      type: object
    PaginationMetadata:
      additionalProperties: false
      properties:
        first_page:
          description: First available page number.
          type: integer
        last_page:
          description: Last available page number.
          type: integer
        next_page:
          description: Next page number.
          type: integer
        page:
          description: Current page number.
          type: integer
        previous_page:
          description: Previous page number.
          type: integer
        total:
