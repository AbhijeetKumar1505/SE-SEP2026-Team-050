        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '409':
          $ref: '#/components/responses/CONFLICT'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Add one student to the roster
      tags:
      - students
      x-roles:
      - iic
      x-user-stories:
      - US-15
  /api/students/roster/import:
    post:
      description: 'The CSV template has three columns: `name`, `roll number` and
        `institute email`. The web app

        reads the file and sends its rows here as `name`, `roll_number` and `institute_email`.


        Each row is checked on its own. Valid rows are saved: a roll number already
        on the roster is

        updated instead of duplicated, and a removed student is put back. Invalid
        rows are returned in

        `errors` with their CSV row number (the header is row 1) and the reason, for
        example an invalid

        roll number, an email outside the approved domains, or a roll number repeated
        in the file.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RosterImport'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterImportResult'
          description: OK
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Import the roster from a CSV file
      tags:
      - students
      x-roles:
      - iic
      x-user-stories:
      - US-15
  /api/students/roster/{entry_id}/remove:
    parameters:
    - in: path
      name: entry_id
      required: true
      schema:
        minimum: 0
        type: integer
    post:
      description: 'The student can no longer sign up or submit a new problem: both
        are refused with "You are not

        registered with IIC". An account they already have, and any mentorship in
        progress, carry on.

        The reason is kept in the audit log.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveReason'
        required: true
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '409':
          $ref: '#/components/responses/CONFLICT'
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      security:
      - bearerAuth: []
      summary: Remove a student from the roster
      tags:
      - students
      x-roles:
      - iic
      x-user-stories:
      - US-15
