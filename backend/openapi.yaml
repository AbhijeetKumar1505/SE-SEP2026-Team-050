components:
  headers:
    PAGINATION:
      description: Pagination metadata
      schema:
        $ref: '#/components/schemas/PaginationMetadata'
  responses:
    BAD_REQUEST:
      content:
        application/json:
          example:
            code: 400
            message: The request could not be read.
            status: Bad Request
          schema:
            $ref: '#/components/schemas/Error'
      description: The request body is not valid JSON.
    CONFLICT:
      content:
        application/json:
          example:
            code: 409
            message: This conflicts with the current state of the resource.
            status: Conflict
          schema:
            $ref: '#/components/schemas/Error'
      description: The request conflicts with the current state, for example a duplicate
        or a status that does not allow it.
    DEFAULT_ERROR:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Any other error, in the shared error format.
    FORBIDDEN:
      content:
        application/json:
          example:
            code: 403
            message: You do not have permission to do this.
            status: Forbidden
          schema:
            $ref: '#/components/schemas/Error'
      description: Not allowed for this user, for example the wrong role, someone
        else's record, or (at sign-up) a roll number that is not on IIC's roster.
    GONE:
      content:
        application/json:
          example:
            code: 410
            message: This link has expired.
            status: Gone
          schema:
            $ref: '#/components/schemas/Error'
      description: The link has expired. Ask for a new one.
    INTERNAL_SERVER_ERROR:
      content:
        application/json:
          example:
            code: 500
            message: Something went wrong on the server. Please try again.
            status: Internal Server Error
          schema:
            $ref: '#/components/schemas/Error'
      description: Unexpected server error. It is logged; the response never includes
        its details.
    NOT_FOUND:
      content:
        application/json:
          example:
            code: 404
            message: The requested resource was not found.
            status: Not Found
          schema:
            $ref: '#/components/schemas/Error'
      description: No such resource, or it is not visible to this user.
    UNAUTHORIZED:
      content:
        application/json:
          example:
            code: 401
            message: Log in to continue.
            status: Unauthorized
          schema:
            $ref: '#/components/schemas/Error'
      description: Not logged in, or the login token has expired.
    UNPROCESSABLE_ENTITY:
      content:
        application/json:
          example:
            code: 422
            errors:
              json:
                description:
                - Shorter than minimum length 30.
            message: Some fields are invalid.
            status: Unprocessable Entity
          schema:
            $ref: '#/components/schemas/Error'
      description: One or more fields are invalid. `errors` names each field and what
        is wrong with it.
  schemas:
    Activate:
      additionalProperties: false
      properties:
        password:
          description: At least 8 characters
          example: a-strong-password
          maxLength: 128
          minLength: 8
          type: string
          writeOnly: true
      required:
      - password
      type: object
    ActivationInfo:
      additionalProperties: false
      properties:
        name:
          example: Rahul Menon
          type: string
        valid:
          example: true
          type: boolean
        verified_by:
          description: Who in IIC verified the mentor
          type: string
      required:
      - name
      - valid
      - verified_by
      type: object
    Actor:
      additionalProperties: false
      properties:
        email:
          example: deepa.krishnan@iitm.ac.in
          format: email
          type: string
        id:
          example: 2
          type: integer
      required:
      - email
      - id
      type: object
    Assign:
      additionalProperties: false
      properties:
        mentor_id:
          example: 4
          type: integer
      required:
      - mentor_id
      type: object
    Assignment:
      additionalProperties: false
      properties:
        assigned_at:
          format: date-time
          type: string
        assigned_by:
          example: deepa
          type: string
        deadline:
          description: When the mentor must respond (UTC)
          format: date-time
          type: string
        goal:
          example: Clarity on electives
          type: string
        id:
          example: 3
          type: integer
        problem:
          example: Choosing electives...
          type: string
        student:
          additionalProperties: {}
          example:
            careerInterest: Job
            courses: Python, DBMS
            level: BS
            name: Rahul
          type: object
        tags:
          example:
          - Computer vision
          items:
            type: string
          type: array
      required:
      - assigned_at
      - assigned_by
      - deadline
      - goal
      - id
      - problem
      - student
      - tags
      type: object
    AuditEntry:
      additionalProperties: false
      properties:
        action:
          example: verify_mentor
          type: string
        actor:
          anyOf:
          - $ref: '#/components/schemas/Actor'
          - nullable: true
            type: object
          description: Who did it. Empty for automatic actions, such as the daily
            checks
        created_at:
          description: When it happened (UTC)
          format: date-time
          type: string
        details:
          example: Verified after checking LinkedIn and employer.
          nullable: true
          type: string
        entity_id:
          example: 3
          nullable: true
          type: integer
        entity_type:
          example: mentor
          type: string
        id:
          example: 41
          type: integer
      required:
      - action
      - actor
      - created_at
      - details
      - entity_id
      - entity_type
      - id
      type: object
    CandidateMentor:
      additionalProperties: false
      properties:
        availability:
          example: &id001
          - Saturday 10:00-12:00
          items:
            type: string
          type: array
        available:
          type: boolean
        capacity:
          example: 1
          type: integer
        capacity_requested:
          description: IIC has asked for one more student
          type: boolean
        channel:
          example: Google Meet
          nullable: true
          type: string
        contact:
          nullable: true
          type: string
        email:
          example: rahul.menon@example.com
          type: string
        experience:
          example: &id002
          - Internship at TCS (3 months)
          items:
            type: string
          type: array
        expertise:
          example: &id003
          - SQL and database design
          items:
            type: string
          type: array
        headline:
          example: Data scientist at Flipkart
          nullable: true
          type: string
        id:
          example: 4
          type: integer
        load:
          description: Pending and active mentorships
          example: 1
          type: integer
        name:
          example: Rahul Menon
          type: string
        shared_tags:
          description: The problem's topic tags this mentor has
          example:
          - Computer vision
          items:
            type: string
          type: array
        shared_tags_count:
          example: 1
          type: integer
        status:
          description: pending_verification, verified (not activated yet), active
            or removed
          enum:
          - pending_verification
          - verified
          - active
          - removed
          type: string
        timezone:
          example: Asia/Kolkata
          nullable: true
          type: string
        verified_at:
          format: date-time
          nullable: true
          type: string
        verified_by:
          description: The IIC coordinator who verified them
          nullable: true
          type: string
      required:
      - availability
      - available
      - capacity
      - capacity_requested
      - email
      - experience
      - expertise
      - id
      - load
      - name
      - shared_tags
      - shared_tags_count
      - status
      type: object
    CapacityRequestAnswer:
      additionalProperties: false
      properties:
        accept:
          example: true
          type: boolean
      required:
      - accept
      type: object
    CapacityRequestResponse:
      additionalProperties: false
      properties:
        capacity:
          example: 2
          type: integer
        id:
          example: 1
          type: integer
        status:
          example: accepted
          type: string
      required:
      - capacity
      - id
      - status
      type: object
    Case:
      additionalProperties: false
      properties:
        case_type:
          example: change
          type: string
        decision:
          example: reassign
          nullable: true
          type: string
        decision_reason:
          nullable: true
          type: string
        details:
          type: string
        id:
          example: 3
          type: integer
        mentorship_id:
          type: integer
        opened_at:
          format: date-time
          type: string
        resolved_at:
          format: date-time
          nullable: true
          type: string
        status:
          example: under_review
          type: string
      required:
      - case_type
      - details
      - id
      - mentorship_id
      - opened_at
      - status
      type: object
    CaseCreate:
      additionalProperties: false
      properties:
        case_type:
          description: change, end or misconduct
          enum:
          - change
          - end
          - misconduct
          example: change
          type: string
        details:
